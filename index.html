<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    let input = document.querySelector('.add-form-name'); 
    let textInput = document.querySelector('.add-form-text');
    let btn = document.querySelector('.add-form-button');
    let list = document.querySelector('.comments');
    let cont = document.querySelector('.container');
    
    let counter = 0
    
    let options = {hour: '2-digit', minute:'2-digit'};
    let optDate = {year: '2-digit', month: '2-digit', day: '2-digit'}
    
    


    let likesArr = [
      { name: "Глеб Фокин",
        coment: "Это будет первый комментарий на этой странице",
        date: "12.02.22 12:18",
        likeNumber: 3,
        like: false
      },
      { name: "Варвара Н",
        coment: "Мне нравится как оформлена эта страница! ❤",
        date: "13.02.22 19:22",
        likeNumber: 75,
        like: true
      },
      
    ]

    likesArr.likeNumber = counter;

    const initClick = () => {
          const btns = document.querySelectorAll(".like-button");

          for (const btn of btns) {
             
              btn.addEventListener('click', () => {
                  const indexLike = btn.dataset.num;
                
                  const commentObj = likesArr[indexLike];
                 console.log('click');
                 console.log(likesArr);
                 if (commentObj.like) {
                  commentObj.likeNumber -= 1
                  commentObj.like = false
                  
                  console.log(likesArr);
              
                } else {
                  commentObj.likeNumber += 1
                  commentObj.like = true;
                }

                comentLi();                   
              })
              
          }
      
      }
      
    const comentLi = () => {
      list.innerHTML = likesArr.map((like, index) => {
              return `<li class="comment"><div class="comment-header">
            <div>${like.name}</div>
            <div>${like.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${like.coment}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter" >${like.likeNumber}</span>
              <button class="like-button ${like.like ? "-active-like":""}" data-num="${index}"></button>
            </div>
          </div>
        </li>`;
          }).join("");
          console.log('рендорю');
          
          initClick()
          
    }
    comentLi()
  
    btn.addEventListener('click', function (e) {
      if (input.value === '' || textInput.value === '') {
        return alert('Строчки должны быть заполнены!');
      }
      console.log("работаем");
      
      let newLikeArr = { name: input.value,
        coment: textInput.value,
        date: new Date().toLocaleDateString('ru-RU', optDate) + " " + new Date().toLocaleTimeString('ru-RU', options),
        likeNumber: counter,
        like: false
      }
      likesArr.push(newLikeArr)
      textInput.value = ""
      input.value = "" 
      comentLi();
      
    })

    console.log("It works!");
  </script>
   
</html>
